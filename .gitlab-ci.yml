spec:
  inputs:
    skip_docs:
      type: boolean
      default: false
      description: "Run pipeline on master without building project docs"
---

image: registry.gitlab.com/byacrates/zappy:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

stages:
  - test
  - validate
  - build
  - release
  - docs

cache:
  key: "cargo-$CI_COMMIT_REF_SLUG"
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/

test:
  stage: test
  script:
    - echo "Running tests..."
    - just ci
    - awk '/^TOTAL / { print "LINES_COVERAGE " $10 }' coverage/coverage.txt
  coverage: '/LINES_COVERAGE\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

validate:
  stage: validate
  rules:
    - changes:
        - crates/zappy-templates/templates/*
  script:
    - echo "Validating templates..."
    - just test-templates

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - just build
    - just build-windows
  artifacts:
    name: "zappy-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/release/zappy
      - target/x86_64-pc-windows-gnu/release/zappy.exe
    expire_in: 7 days

upload-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p release-assets
    - cp target/release/zappy release-assets/zappy
    - cp target/x86_64-pc-windows-gnu/release/zappy.exe release-assets/zappy.exe
  artifacts:
    name: "release-assets-$CI_COMMIT_TAG"
    paths:
      - release-assets/zappy
      - release-assets/zappy.exe
    expire_in: never
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: zappy (linux)
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/release-assets/zappy"
          filepath: "/binaries/zappy"
        - name: zappy.exe (windows)
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/release-assets/zappy.exe"
          filepath: "/binaries/zappy.exe"

docs:
  stage: docs
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $[[ inputs.skip_docs ]] == false
  script:
    - just docs-all
  pages: true
