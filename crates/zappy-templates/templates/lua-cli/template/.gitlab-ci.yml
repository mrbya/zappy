image: __GITLAB_IMAGE_REGISTRY__:latest

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_BRANCH == "master"
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - release
  - publish

variables:
  PACKAGE_VERSION: ${CI_COMMIT_TAG}
  API_KEY: ${CI_API_KEY}

test:
  stage: test
  script:
    - echo "Running __ZAPPY_PROJECT_NAME_SNAKE__ tests..."
    - just install
    - just ci
    - awk '/^TOTAL / { print "LINES_COVERAGE " $10 }' coverage.txt
  coverage: '/LINES_COVERAGE\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - luacov.report.out

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating gitlab release..."
    - release-cli create --name "Release ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" --description "__ZAPPY_PROJECT_NAME_SNAKE__ release ${CI_COMMIT_TAG}."

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Publishing luarock..."
    - just install
    - just upload ${CI_API_KEY}
